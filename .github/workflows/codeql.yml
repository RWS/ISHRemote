name: CodeQL

# Static security analysis of the C# sources. Uses build-mode 'none' so it does NOT need the
# Windows-only multi-target build - it scans the sources directly on a fast Linux runner.
# PowerShell is not a CodeQL-supported language, so only the C# surface (auth, proxies, cmdlets,
# objects) is analyzed. Runs on C# changes and weekly.

on:
  push:
    branches: [ master ]
    paths:
      - 'Source/**/*.cs'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'Source/**/*.cs'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: none
    steps:
      - uses: actions/checkout@v5
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
